 y="107">${nf(warn)}</text></g><g class="flow-node" data-flow="error" tabindex="0" role="button" aria-label="エラーログを見る"><rect x="190" y="167" width="10" height="22" rx="2" fill="var(--red)"/><text class="flow-label" x="210" y="173">エラー・重大</text><text class="flow-value" x="210" y="190">${nf(err)}</text></g><g class="flow-node" data-flow="notifications" tabindex="0" role="button" aria-label="通知設定を見る"><rect x="390" y="45" width="10" height="114" rx="2" fill="var(--blue)"/><text class="flow-label" x="410" y="90">通知対象</text><text class="flow-value" x="410" y="110">${nf(send)}</text><rect x="390" y="169" width="10" height="18" rx="2" fill="var(--faint)"/><text class="flow-label" x="410" y="183">重複抑制 ${nf(suppressed)}</text></g><g class="flow-node" data-flow="notifications" tabindex="0" role="button" aria-label="通知結果を見る"><rect x="575" y="45" width="10" height="110" rx="2" fill="var(--green)"/><text class="flow-label" x="597" y="88">配送完了</text><text class="flow-value" x="597" y="109">${nf(done)}</text><rect x="575" y="177" width="10" height="4" rx="1" fill="var(--red)"/><text class="flow-label" x="597" y="183">失敗 ${nf(failed)}</text></g></svg></div><div class="flow-note">${icon('info')}ノードから関連ログへ移動。帯は処理経路を示す概念図です。</div></section>`}
function incidentPanel(){const items=state.env==='stg'?[]:activeIncidents().filter(x=>state.scope==='all'||state.scope===x.service);return `<section class="panel"><div class="panel-head"><div><h2 class="panel-title">対応が必要な問題 <span class="count">${items.length}</span></h2><p class="panel-sub">重大度の高い順に表示</p></div><span class="dot amber"></span></div><div class="incident-list">${items.slice(0,3).map(x=>`<button class="incident-row" data-incident="${x.id}"><span class="severity-icon ${x.severity==='warn'?'warn':''}">${icon(x.severity==='warn'?'clock':'alert')}</span><span class="incident-body"><b>${x.summary.replace('。','')}</b><small>${x.service} <span> / </span> ${x.node} <span> · </span> ${ack[x.id]==='working'?'対応中':'未対応'}</small></span><span class="incident-time">${x.time.slice(0,5)}</span></button>`).join('')||'<div class="empty">対応が必要な問題はありません</div>'}</div><div class="panel-bottom"><span>${items.length} 件の未解決インシデント</span><button class="btn link" data-nav="incidents">すべて見る ${icon('arrow')}</button></div></section>`}
function filteredLogs(){return logs.filter(x=>(state.scope==='all'||x.service===state.scope)&&(state.env==='prod'||x.severity==='info')&&(state.node==='all'||x.node===state.node)&&(state.severity==='all'||(state.severity==='abnormal'?x.severity!=='info':state.severity==='errors'?['critical','error'].includes(x.severity):x.severity===state.severity))&&(!state.query||Object.values(x).join(' ').toLowerCase().includes(state.query.toLowerCase())))}
function logTable(items){return `<div class="table-scroll"><table><thead><tr><th>受信時刻 (JST)</th><th>サービス</th><th>重大度</th><th>チェック / 分類</th><th>内容</th><th>ノード</th></tr></thead><tbody>${items.map(x=>`<tr tabindex="0" data-log="${x.id}" aria-label="${x.id} の詳細"><td class="mono text-muted">11/03 ${x.time}</td><td>${x.service}</td><td>${badge(x.severity)}</td><td class="code-name mono">${x.check}</td><td class="summary-cell">${x.summary}</td><td class="node-chip mono">${x.node}</td></tr>`).join('')}</tbody></table>${!items.length?'<div class="empty">条件に一致する監視ログはありません。</div>':''}</div>`}
function dashboard(){const alarm=state.env==='prod'&&activeIncidents().some(x=>x.severity==='critical'&&(state.scope==='all'||x.service===state.scope));return header('dashboard')+toolbar()+(alarm?`<div class="alert-strip">${icon('alert')}<div><b>1件の重大な障害が発生しています</b><span>DELIVERY の印刷サービスに接続できません。</span></div><button class="btn link" data-incident="MON-00142">詳細を確認 ${icon('arrow')}</button></div>`:'')+kpis()+`<div class="main-grid ${!widgets.trend||!widgets.services?'single':''}" ${!widgets.trend||!widgets.services?'style="grid-template-columns:1fr"':''}>${widgets.trend?trendPanel():''}${widgets.services?servicePanel():''}</div><div class="main-grid" ${!widgets.flow||!widgets.incidents?'style="grid-template-columns:1fr"':''}>${widgets.flow?flowPanel():''}${widgets.incidents?incidentPanel():''}</div>${widgets.logs?`<section class="panel table-panel"><div class="panel-head"><div><h2 class="panel-title">最新の監視ログ</h2><p class="panel-sub">現在の検索条件に一致する最新5件</p></div><button class="btn link" data-nav="logs">監視ログを開く ${icon('arrow')}</button></div>${logTable(filteredLogs().slice(0,5))}<div class="panel-bottom"><span>表示基準 2026/11/03 19:28 JST</span><span>受信時刻の新しい順</span></div></section>`:''}`}
const serviceEvents=[74,38,28,18,0,0,0],previousEvents=[96,58,32,24,0,0,0];
function comparisonPanel(){const list=services.map(x=>{const n=serviceStats(x.id);return {...x,current:n.warn+n.err,previous:n.prevWarn+n.prevErr}}).filter(x=>state.scope==='all'||x.id===state.scope);const max=Math.max(...list.map(x=>Math.max(x.current,x.previous)),1);return `<section class="panel"><div class="panel-head"><div><h2 class="panel-title">サービス別の異常件数</h2><p class="panel-sub">同一障害の再検知を含む</p></div>${icon('chart')}</div><div class="chart-legend"><div class="legend"><span class="legend-item"><i class="dot blue"></i>今回</span>${state.compare?'<span class="legend-item"><i class="dot" style="background:var(--faint)"></i>前期間</span>':''}</div><span class="chart-hint">件</span></div><div class="bar-chart">${list.map(x=>`<div class="bar-row"><span>${x.id}</span><div class="bar-pair"><div class="hbar" style="width:${x.current/max*100}%" title="${x.id} 今回 ${nf(x.current)}件"></div>${state.compare?`<div class="hbar prev" style="width:${x.previous/max*100}%" title="${x.id} 前期間 ${nf(x.previous)}件"></div>`:''}</div><span class="bar-num">${nf(x.current)}</span></div>`).join('')}</div></section>`}
function heatmap(){return `<section class="panel"><div class="panel-head"><div><h2 class="panel-title">異常が発生しやすい時間帯</h2><p class="panel-sub">10/28〜11/03 / 全サービスの固定サンプル</p></div><span class="badge neutral">固定期間</span></div><div class="heatmap"><div class="heat-head"><span></span>${Array.from({length:12},(_,i)=>`<span>${i*2}:00</span>`).join('')}</div>${['10/28 水','10/29 木','10/30 金','10/31 土','11/01 日','11/02 月','11/03 火'].map((day,d)=>`<div class="heat-row"><label>${day}</label>${Array.from({length:12},(_,h)=>{const count=d===6&&h>=10?0:Math.max(0,((d*5+h*3)%7)+(h>=7&&h<10?7:0)-(d===4?3:0));return `<button class="heat-cell" ${d===6&&h>=10?'disabled':''} style="--heat:${d===6&&h>=10?.08:.12+count/17}" data-heat="${day}|${h*2}|${count}" aria-label="${day} ${h*2}時から${h*2+2}時 ${d===6&&h>=10?'未集計':count+'件'}" title="${day} ${h*2}:00–${h*2+2}:00：${d===6&&h>=10?'未集計':count+'件'}"></button>`}).join('')}</div>`).join('')}<div class="heat-legend">少ない ${[.12,.3,.5,.7,1].map(o=>`<i style="opacity:${o}"></i>`).join('')} 多い</div></div><div class="panel-bottom"><span id="heatDetail">セルを選ぶと日時と件数を表示。11/03 の20時以降は未集計です。</span></div></section>`}
function analytics(){const s=stats();return header('analytics')+toolbar()+kpis()+`<div class="main-grid">${trendPanel(true)}${comparisonPanel()}</div><div class="main-grid">${flowPanel()}<section class="panel"><div class="panel-head"><div><h2 class="panel-title">判定結果の内訳</h2><p class="panel-sub">監視実行 ${nf(s.total)} 回の結果</p></div></div><div style="padding:22px"><div style="display:flex;align-items:center;gap:28px"><svg viewBox="0 0 130 130" style="width:130px;height:130px;flex-shrink:0" role="img" aria-label="正常${(s.normal/s.total*100).toFixed(2)}パーセント"><circle cx="65" cy="65" r="51" fill="none" stroke="var(--border)" stroke-width="9"/><circle cx="65" cy="65" r="51" fill="none" stroke="var(--green)" stroke-width="9" stroke-dasharray="${s.normal/s.total*320.44} 320.44" transform="rotate(-90 65 65)"/><text x="65" y="63" text-anchor="middle" fill="var(--text)" style="font-size:23px">${(s.normal/s.total*100).toFixed(2)}<tspan font-size="10">%</tspan></text><text x="65" y="84" text-anchor="middle" fill="var(--faint)" font-size="10">正常判定率</text></svg><div style="flex:1">${[['正常',s.normal,'green'],['警告',s.warn,'amber'],['エラー・重大',s.err,'red']].map(([label,n,c])=>`<div style="display:flex;justify-content:space-between;gap:15px;margin:12px 0;font-size:10px"><span class="text-muted"><i class="dot ${c}"></i> ${label}</span><span class="mono">${nf(n)}</span></div>`).join('')}</div></div><div class="data-notice" style="margin:18px 0 0;font-size:9px">正常判定率は正常件数 ÷ 監視実行数。サービスの可用性とは異なります。</div></div></section></div>${heatmap()}<section class="panel table-panel" style="margin-top:20px"><div class="panel-head"><h2 class="panel-title">期間比較の詳細</h2><span class="text-muted" style="font-size:10px">今回と直前の同じ長さの期間</span></div><div class="table-scroll"><table><thead><tr><th>指標</th><th>今回の${periodName()}</th><th>直前の${periodName()}</th><th>差分</th><th>変化率</th></tr></thead><tbody>${[['監視実行数',s.total,s.prev],['異常検知数',s.abnormal,s.prevAbnormal],['警告',s.warn,s.prevWarn],['エラー・重大',s.err,s.prevErr]].map(([label,n,p])=>`<tr><td>${label}</td><td class="mono">${nf(n)}</td><td class="mono text-muted">${nf(p)}</td><td class="mono text-green">${nf(n-p)}</td><td class="mono text-green">${p?((n/p-1)*100).toFixed(1)+'%':'—'}</td></tr>`).join('')}</tbody></table></div></section>`}
function logPage(){return header('logs')+toolbar()+`<div class="data-notice">${icon('info')}デザイン確認用の代表ログ24件です。統計グラフは期間全体のサンプル集計です。</div><section class="panel"><div class="filter-row"><div class="filter-search">${icon('search')}<input id="logSearch" placeholder="内容・チェック名・エラー番号を検索" aria-label="ログを検索" value="${esc(state.query)}"></div><select class="field-select" id="severityFilter" aria-label="重大度"><option value="all">すべての重大度</option>${[['abnormal','警告・エラー・重大'],['critical','重大'],['error','エラー'],['errors','エラー・重大'],['warn','警告'],['info','正常']].map(([v,l])=>`<option value="${v}" ${state.severity===v?'selected':''}>${l}</option>`).join('')}</select><select class="field-select" id="nodeFilter" aria-label="ノード"><option value="all">すべてのノード</option>${['web1','web2'].map(v=>`<option ${state.node===v?'selected':''}>${v}</option>`).join('')}</select><button class="btn subtle" data-action="clear-filters">リセット</button></div><div id="logResults">${logTable(filteredLogs())}</div><div class="panel-bottom"><span id="logCount">${filteredLogs().length} 件 / 代表ログ 24件</span><span>2026/11/03 19:28 JST 時点</span></div></section>`}
function incidentPage(){const items=(state.env==='stg'?[]:incidents).filter(x=>(state.scope==='all'||state.scope===x.service)&&(state.incidentTab==='all'||state.incidentTab==='resolved'?state.incidentTab==='all'||ack[x.id]==='resolved':ack[x.id]!=='resolved'));return header('incidents')+toolbar()+`<div class="tabs">${[['open','未解決'],['resolved','解決済み'],['all','すべて']].map(([v,l])=>`<button data-incident-tab="${v}" class="${state.incidentTab===v?'active':''}">${l}<small>${v==='open'?activeIncidents().length:v==='resolved'?incidents.length-activeIncidents().length:incidents.length}</small></button>`).join('')}</div><section class="panel table-panel"><div class="panel-head"><h2 class="panel-title">インシデント一覧</h2><p class="panel-sub">同一障害をまとめて表示</p></div><div class="table-scroll"><table><thead><tr><th>重大度</th><th>エラー番号 / 発生時刻</th><th>サービス</th><th>内容</th><th>対応状況</th><th></th></tr></thead><tbody>${items.map(x=>`<tr data-incident="${x.id}" tabindex="0"><td>${badge(x.severity)}</td><td class="mono">${x.id}<small style="display:block;font-size:9px;color:var(--faint)">11/03 ${x.time}</small></td><td>${x.service}</td><td class="summary-cell">${x.summary}</td><td><span class="badge ${ack[x.id]==='resolved'?'ok':ack[x.id]==='working'?'blue':'neutral'}">${ack[x.id]==='resolved'?'解決済み':ack[x.id]==='working'?'対応中':'未対応'}</span></td><td>${icon('arrow')}</td></tr>`).join('')}</tbody></table>${!items.length?'<div class="empty">この条件のインシデントはありません。</div>':''}</div><div class="panel-bottom"><span>${items.length} 件</span><span>対応状態の変更はデモ内で保存されます。</span></div></section>`}
function servicePage(){return header('services')+toolbar()+`<div class="service-cards">${services.filter(x=>state.scope==='all'||x.id===state.scope).map(s=>`<section class="panel service-card"><div class="service-card-top"><span class="service-monogram" style="width:35px;height:35px;font-size:12px">${s.tag}</span>${badge(state.env==='stg'?'ok':s.status)}</div><h3>${s.id}</h3><p>${s.name}</p>${statusBars(s,true)}<div class="service-metrics"><div><span>サンプル可用性 / 24h</span><b>${state.env==='stg'?'100':s.rate}<small style="font-size:10px"> %</small></b></div><div><span>平均応答時間</span><b>${nf(state.env==='stg'?Math.round(s.latency*.6):s.latency)}<small style="font-size:10px"> ms</small></b></div></div><button class="btn" data-service="${s.id}">サービスの詳細 ${icon('arrow')}</button></section>`).join('')}</div>`}
function rulesPage(){const filtered=rules.filter(r=>(state.scope==='all'||r.scope==='すべて'||r.scope===state.scope)&&(!state.ruleQuery||(r.name+r.code+r.scope).toLowerCase().includes(state.ruleQuery.toLowerCase())));return header('rules')+`<div class="data-notice">${icon('info')}設定変更はこのブラウザー内のデモに保存されます。本番環境には反映されません。</div><div class="rule-cards"><div class="mini-stat"><span>有効な監視ルール</span><b>${rules.filter(x=>x.enabled).length}<small> / ${rules.length}</small></b><small>優先順位に沿って評価</small></div><div class="mini-stat"><span>通知ルール</span><b>${rules.filter(x=>x.enabled&&x.action==='通知').length}</b><small>重複通知は自動抑制</small></div><div class="mini-stat"><span>直近24時間の検知</span><b>158<small> 件</small></b><small>保存済みサンプル</small></div></div><div class="tabs">${[['rules','ルール一覧'],['flow','評価フロー'],['history','変更履歴']].map(([v,l])=>`<button data-rule-tab="${v}" class="${state.ruleTab===v?'active':''}">${l}${v==='rules'?`<small>${rules.length}</small>`:v==='history'?`<small>${history.length}</small>`:''}</button>`).join('')}</div>${state.ruleTab==='rules'?`<p class="rule-tip">${icon('info')}優先順位の小さい順にすべての有効なルールを評価します。重複した通知はまとめて配信します。</p><section class="panel"><div class="filter-row"><div class="filter-search">${icon('search')}<input id="ruleSearch" aria-label="ルールを検索" placeholder="ルール名・チェック名を検索" value="${esc(state.ruleQuery)}"></div><select id="scopeFilter" class="field-select" aria-label="対象サービス"><option value="all">すべてのサービス</option>${services.map(s=>`<option ${s.id===state.scope?'selected':''}>${s.id}</option>`).join('')}</select></div><div class="table-scroll"><table class="rule-table"><thead><tr><th>優先順位</th><th>ルール名 / チェック</th><th>対象</th><th>判定条件</th><th>重大度</th><th>動作</th><th>有効</th><th></th></tr></thead><tbody>${filtered.map(r=>{const i=rules.indexOf(r);return `<tr><td><span class="priority mono"><span>${String(i+1).padStart(2,'0')}</span><span class="reorder"><button data-move="${r.id}" data-dir="-1" ${i===0?'disabled':''} aria-label="${esc(r.name)}の優先順位を上げる">⌃</button><button data-move="${r.id}" data-dir="1" ${i===rules.length-1?'disabled':''} aria-label="${esc(r.name)}の優先順位を下げる">⌄</button></span></span></td><td class="rule-name">${esc(r.name)}<small class="mono">${esc(r.code)}</small></td><td>${esc(r.scope)}</td><td class="rule-condition">${esc(r.condition)}</td><td>${badge(r.severity)}</td><td><span class="badge ${r.action==='通知'?'blue':'neutral'}">${esc(r.action)}</span></td><td><button class="switch" role="switch" aria-checked="${r.enabled}" data-toggle-rule="${r.id}" aria-label="${esc(r.name)}を${r.enabled?'無効':'有効'}にする"></button></td><td><button class="icon-btn" data-edit-rule="${r.id}" aria-label="${esc(r.name)}を編集">${icon('edit')}</button></td></tr>`}).join('')}</tbody></table>${!filtered.length?'<div class="empty">一致するルールはありません。</div>':''}</div><div class="panel-bottom"><span>${filtered.length} 件のルール</span><button class="btn link" data-action="add-rule">${icon('plus')}ルールを追加</button></div></section>`:state.ruleTab==='flow'?`<section class="panel"><div class="panel-head"><div><h2 class="panel-title">イベント評価の流れ</h2><p class="panel-sub">有効なルールの優先順位を反映しています</p></div></div><div class="evaluation-list"><div class="evaluation-step"><span class="num">↓</span><div><b>監視データを収集</b><p>アプリケーションログ・業務チェック・死活監視</p></div></div>${rules.filter(r=>r.enabled).map((r,i)=>`<div class="evaluation-step"><span class="num">${i+1}</span><div><b>${esc(r.name)}</b><p>${esc(r.scope)} / ${esc(r.condition)}</p></div><span class="badge ${r.action==='通知'?'blue':'neutral'}">${esc(r.action)}</span></div>`).join('')}<div class="evaluation-step"><span class="num">✓</span><div><b>判定結果を記録し、重複を抑制して通知</b><p>Slack・メールなど、設定済みの通知先へ配送</p></div></div></div></section>`:`<section class="panel table-panel"><div class="panel-head"><h2 class="panel-title">このブラウザーの設定変更履歴</h2></div><div class="table-scroll"><table><thead><tr><th>変更日時 (JST)</th><th>変更内容</th><th>対象ルール</th></tr></thead><tbody>${history.map(h=>`<tr><td class="mono text-muted">${esc(h.time)}</td><td>${esc(h.action)}</td><td>${esc(h.name)}</td></tr>`).join('')}</tbody></table>${!history.length?'<div class="empty">まだ変更はありません。ルールを編集すると履歴が残ります。</div>':''}</div></section>`}`}
function notificationsPage(){return header('notifications')+`<div class="data-notice">${icon('info')}通知先はデザイン確認用です。テスト通知は画面内で模擬実行します。</div><div class="notification-grid">${[['slack','message','Slack 通知','監視チャンネルへ重大な問題を通知します。','# sakemaru-alerts'],['email','mail','メール通知','Slack 障害時の代替連絡先を設定します。','代替通知先'],['external','pulse','外部の死活監視','監視サーバー自身の停止を外部から検知します。','HTTPS / 60秒間隔']].map(([key,ic,title,desc,dest])=>`<section class="panel notification-card">${icon(ic)}<h3>${title}</h3><p>${desc}</p><div class="text-muted mono" style="font-size:11px">${dest}</div><span class="badge ${key==='external'?'ok':notify[key]?'ok':'warn'}">${key==='external'?'稼働中':notify[key]?'有効':'未設定'}</span><button class="btn" data-channel="${key}">${icon('sliders')}設定を確認</button></section>`).join('')}</div><section class="panel"><div class="panel-head" style="padding-bottom:20px"><div><h2 class="panel-title">通知の動作</h2><p class="panel-sub">障害の重要度を保ちながら、不要な通知を抑えます。</p></div></div>${[['group','同一障害の通知をまとめる','同じチェック・サービス・ノードの通知を5分間まとめます。'],['recovery','復旧したときにも通知する','警告・エラーから正常に戻った際に、復旧を通知します。'],['quiet','夜間の警告通知を抑制する','22:00〜翌07:00 (JST)。重大・エラーは常に通知します。']].map(([key,title,desc])=>`<div class="notify-setting"><div><b>${title}</b><p>${desc}</p></div><button class="switch" role="switch" aria-checked="${notify[key]}" data-notify-toggle="${key}" aria-label="${title}"></button></div>`).join('')}</section><section class="panel table-panel" style="margin-top:20px"><div class="panel-head"><h2 class="panel-title">通知配送の状態</h2><span class="badge neutral">直近24時間 / サンプル</span></div><div class="table-scroll"><table><thead><tr><th>通知先</th><th>送信対象</th><th>配送完了</th><th>失敗</th><th>成功率</th></tr></thead><tbody><tr><td>Slack / # sakemaru-alerts</td><td class="mono">136</td><td class="mono text-green">132</td><td class="mono text-red">4</td><td class="mono">97.06%</td></tr></tbody></table></div></section>`}
const runbooks=[{title:'印刷サービスに接続できない',service:'DELIVERY',code:'RuntimeException',desc:'配送ラベルが印刷できないときの、接続・サービス・再処理の確認手順。',steps:['印刷対象の端末とプリンターの電源・ネットワーク接続を確認します。','印刷サービスの稼働状態と待受ポートを確認します。','サービスの復旧後、失敗した対象伝票を特定します。','二重印刷にならないことを確認してから、対象伝票を再印刷します。']},{title:'データベースのデッドロック',service:'WMS',code:'QueryException',desc:'競合したトランザクションを特定し、再試行と業務への影響を確認します。',steps:['発生時刻、対象ノード、エラー番号を記録します。','同時刻のトランザクションとデッドロックログを確認します。','自動再試行が成功したか、関連伝票の状態と合わせて確認します。','未処理データが残る場合は、重複登録を避けて個別に再処理します。']},{title:'予定データの受信が遅れている',service:'TRADE',code:'trade.hourly_receive',desc:'EOS・外部連携の受信状態と、送信元の処理結果を確認します。',steps:['対象の取引先、ファイル名、予定時刻を確認します。','受信履歴と外部接続の状態を確認します。','送信元の出荷・送信状況を担当者に確認します。','再受信前に伝票の重複を確認し、必要な対象だけを再処理します。']},{title:'ディスク使用率が高い',service:'共通',code:'monitor.storage',desc:'容量を使用している領域を調査し、ログの保持設定を見直します。',steps:['ノードごとに空き容量と使用率の推移を確認します。','容量が増加しているディレクトリとファイルの種類を確認します。','保管義務や調査に必要なログを退避し、承認済みの保持ルールを確認します。','不要データの整理または容量拡張後、監視値が戻ったことを確認します。']}];
function runbooksPage(){return header('runbooks')+`<div class="data-notice">${icon('info')}以下は手順書のサンプルです。実運用では担当者・連絡先・システム固有の手順を追加します。</div><div class="runbook-list">${runbooks.map((r,i)=>`<section class="panel runbook-card"><span class="badge blue">${r.service}</span><h3>${r.title}</h3><p>${r.desc}</p><div class="panel-bottom" style="padding:15px 0 0"><span class="mono" style="font-size:9px">${r.code}</span><button class="btn link" data-runbook="${i}">手順を確認 ${icon('arrow')}</button></div></section>`).join('')}</div>`}
function render(){renderNav();const views={dashboard,analytics,logs:logPage,incidents:incidentPage,services:servicePage,rules:rulesPage,notifications:notificationsPage,runbooks:runbooksPage};$('#main').innerHTML=views[state.page]();document.title=`${pageMeta[state.page][0]} — 酒丸 Monitor`;bindChart();}
function nav(page,reset=false){if(!pageMeta[page])page='dashboard';if(reset){state.scope='all';state.severity='all';state.query=''}state.page=page;if(location.hash!==`#${page}`)historyReplace(page);$('#sidebar').classList.remove('open');render();window.scrollTo({top:0,behavior:'instant'});}
function historyReplace(page){try{window.history.replaceState(null,'',`#${page}`)}catch{if(location.hash!==`#${page}`)location.hash=page}}
let toastTimer;function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.hidden=true,4000)}
let focusBeforeDrawer=null;function openDrawer(title,content){focusBeforeDrawer=document.activeElement;$('#drawer').innerHTML=`<div class="drawer-top"><h2 id="drawerTitle">${title}</h2><button class="icon-btn" data-action="close-drawer" aria-label="閉じる">${icon('close')}</button></div>${content}`;$('#drawer').hidden=false;$('#overlay').hidden=false;document.body.style.overflow='hidden';$('.app-shell').inert=true;$('#sidebar').inert=true;$('#drawer [data-action="close-drawer"]').focus()}
function closeDrawer(){$('#drawer').hidden=true;$('#overlay').hidden=true;document.body.style.overflow='';$('.app-shell').inert=false;$('#sidebar').inert=false;if(focusBeforeDrawer?.isConnected)focusBeforeDrawer.focus()}
function openLog(id,incident=false){const x=logs.find(x=>x.id===id);if(!x)return;openDrawer(incident?'インシデントの詳細':'監視ログの詳細',`${badge(x.severity)}<h3 style="font-size:17px;font-weight:500;line-height:1.8;margin:18px 0">${x.summary}</h3><p class="drawer-intro mono">${x.id}</p><div class="detail-grid"><div class="detail-item"><span>サービス / ノード</span><b>${x.service} / ${x.node}</b></div><div class="detail-item"><span>受信日時 (JST)</span><b>2026/11/03 ${x.time}</b></div><div class="detail-item"><span>チェック / 分類</span><b class="mono">${x.check}</b></div><div class="detail-item"><span>環境</span><b>華 本番環境</b></div></div><div class="detail-block"><h3>ログ本文</h3><pre>${esc(`[2026-11-03 ${x.time}] ${x.service}.${x.severity.toUpperCase()}\n${x.summary}\nnode: ${x.node}\nevent_id: ${x.id}\ncheck: ${x.check}${x.check==='RuntimeException'?'\nmessage: Connection refused (sample)':x.check==='QueryException'?'\nSQLSTATE[40001]: Deadlock found (sample)':''}`)}</pre></div>${incident?`<label for="incidentStatus">対応状況</label><select id="incidentStatus" class="input"><option value="open" ${!ack[x.id]||ack[x.id]==='open'?'selected':''}>未対応</option><option value="working" ${ack[x.id]==='working'?'selected':''}>対応中</option><option value="resolved" ${ack[x.id]==='resolved'?'selected':''}>解決済み</option></select><div class="info-box">状態変更はデモ内にのみ保存されます。サービスの稼働状態・過去の監視統計は変わりません。</div>`:''}<div class="drawer-actions">${x.severity!=='info'?`<button class="btn" data-runbook="${x.service==='DELIVERY'?0:x.check==='monitor.storage'?3:x.service==='WMS'?1:2}">${icon('book')}対処手順</button>`:''}${incident?`<button class="btn primary" data-save-incident="${x.id}">状態を保存</button>`:`<button class="btn" data-copy-log="${x.id}">${icon('copy')}ログをコピー</button>`}</div>`)}
function openService(id){const s=services.find(s=>s.id===id);openDrawer(`${s.id} の状態`,`${badge(state.env==='stg'?'ok':s.status)}<h3 style="font-size:19px;font-weight:500">${s.name}</h3><p class="drawer-intro">華 ${state.env==='prod'?'本番環境':'ステージング'} / 直近24時間のサンプルデータ</p><div class="detail-grid"><div class="detail-item"><span>可用性</span><b style="font-size:25px">${state.env==='stg'?'100':s.rate}%</b></div><div class="detail-item"><span>平均応答時間</span><b style="font-size:25px">${nf(state.env==='stg'?Math.round(s.latency*.6):s.latency)} ms</b></div><div class="detail-item"><span>監視実行数</span><b>${nf(s.checks)} 回</b></div><div class="detail-item"><span>監視対象</span><b>web1 / web2</b></div></div><div class="detail-block"><h3>直近の稼働履歴</h3>${statusBars(s,true)}<p class="form-note">左：24時間前　右：現在</p></div>${state.env==='prod'&&s.status!=='ok'?`<div class="info-box amber-box">${s.status==='critical'?'印刷サービスとの接続に異常があります。配送処理への影響を確認してください。':'データベースの競合および処理キューの滞留を検知しています。'}</div>`:'<div class="info-box">サービスは正常に稼働しています。</div>'}<div class="drawer-actions"><button class="btn" data-service-analytics="${s.id}">${icon('chart')}統計を見る</button><button class="btn primary" data-service-logs="${s.id}">監視ログを見る ${icon('arrow')}</button></div>`)}

ck"><h3>判定テスト</h3><div style="display:flex;gap:8px"><input class="input" id="testValue" type="number" min="0" step="any" aria-label="テスト値" value="${r.threshold+1}"><button type="button" class="btn" data-action="test-rule">テスト実行</button></div><div id="testResult" class="form-note" role="status">サンプル値でしきい値の判定を確認します。</div></div><div class="drawer-actions"><button type="button" class="btn" data-action="close-drawer">キャンセル</button><button type="submit" class="btn primary">デモ設定を保存</button></div></form>`)}

function openWidgets(){openDrawer('ダッシュボードをカスタマイズ',`<p class="drawer-intro">必要な情報を選んで、自分の監視画面を構成できます。設定はこのブラウザーに保存されます。</p>${[['trend','異常検知数の推移','今回と前期間のグラフ'],['services','サービスの稼働状況','7サービスの状態と履歴'],['flow','異常イベントの処理フロー','検知・通知判定・配送結果'],['incidents','対応が必要な問題','未解決インシデント'],['logs','最新の監視ログ','直近5件の監視結果']].map(([key,label,desc])=>`<div class="widget-picker"><div><b>${label}</b><span>${desc}</span></div><button class="switch" role="switch" aria-checked="${widgets[key]}" data-widget="${key}" aria-label="${label}を表示"></button></div>`).join('')}<div class="drawer-actions"><button class="btn" data-action="reset-widgets">初期表示に戻す</button><button class="btn primary" data-action="close-drawer">完了</button></div>`)}
function openRunbook(i){const r=runbooks[i];openDrawer('対処手順',`<span class="badge blue">${r.service}</span><h3 style="font-size:19px;font-weight:500;margin-top:20px">${r.title}</h3><p class="drawer-intro">${r.desc}</p><ol class="steps">${r.steps.map(s=>`<li>${s}</li>`).join('')}</ol><div class="info-box">デザイン用の参考手順です。操作前に実際の運用手順と担当者を確認してください。</div><div class="drawer-actions"><button class="btn primary" data-action="close-drawer">確認しました</button></div>`)}
function bindChart(){const tooltip=$('.chart-tooltip');if(!tooltip)return;$$('[data-chart-label]').forEach(el=>{const show=()=>{tooltip.hidden=false;tooltip.innerHTML=`<b>${el.dataset.chartLabel}</b><span>今回 ${nf(el.dataset.chartValue)} ${state.chartMode==='latency'?'ms':'件'}</span>${state.compare?`<br><span>前期間 ${nf(el.dataset.chartPrev)} ${state.chartMode==='latency'?'ms':'件'}</span>`:''}`};el.addEventListener('mouseenter',show);el.addEventListener('focus',show);el.addEventListener('mouseleave',()=>tooltip.hidden=true);el.addEventListener('blur',()=>tooltip.hidden=true)})}
function exportCSV(){let rows;if(state.page==='analytics'){const s=stats();rows=[['指標','今回','前期間'],['監視実行数',s.total,s.prev],['正常判定数',s.normal,s.prev-s.prevAbnormal],['異常検知数',s.abnormal,s.prevAbnormal],['警告',s.warn,s.prevWarn],['エラー・重大',s.err,s.prevErr]]}else{let data=state.page==='incidents'?incidents.filter(x=>(state.scope==='all'||x.service===state.scope)&&(state.env==='prod')&&(state.incidentTab==='all'||(state.incidentTab==='resolved'?ack[x.id]==='resolved':ack[x.id]!=='resolved'))):filteredLogs();rows=[['受信日時(JST)','サービス','ノード','重大度','チェック','内容','エラー番号','対応状態'],...data.map(x=>[`2026-11-03 ${x.time}`,x.service,x.node,severityNames[x.severity],x.check,x.summary,x.id,ack[x.id]||'open'])]}const csv='\ufeff'+rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=`sakemaru-${state.page}-${state.period}-sample.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('表示条件のサンプルデータをCSVに出力しました。')}
document.addEventListener('click',async e=>{
 const el=e.target.closest('button,a,[data-log],[data-incident],[data-flow]');if(!el)return;
 if(el.matches('.nav-link')){e.preventDefault();nav(el.hash.slice(1));return}
 if(el.dataset.nav){nav(el.dataset.nav);return}
 if(el.dataset.period){state.period=el.dataset.period;render();return}
 if(el.dataset.chartMode){state.chartMode=el.dataset.chartMode;render();return}
 if(el.dataset.service){openService(el.dataset.service);return}
 if(el.dataset.incident){openLog(el.dataset.incident,true);return}
 if(el.dataset.log){openLog(el.dataset.log);return}
 if(el.dataset.editRule){openRule(el.dataset.editRule);return}
 if(el.dataset.ruleTab){state.ruleTab=el.dataset.ruleTab;render();return}
 if(el.dataset.incidentTab){state.incidentTab=el.dataset.incidentTab;render();return}
 if(el.dataset.toggleRule){const r=rules.find(x=>x.id===el.dataset.toggleRule);r.enabled=!r.enabled;logRuleChange(r.enabled?'ルールを有効化':'ルールを無効化',r);render();toast(`${r.name}を${r.enabled?'有効':'無効'}にしました（デモ設定）。`);return}
 if(el.dataset.move){const i=rules.findIndex(x=>x.id===el.dataset.move),j=i+Number(el.dataset.dir);if(j<0||j>=rules.length)return;const r=rules[i];[rules[i],rules[j]]=[rules[j],rules[i]];logRuleChange(`優先順位 ${i+1} → ${j+1}`,r);render();return}
 if(el.dataset.widget){const key=el.dataset.widget;widgets[key]=!widgets[key];save('widgets',widgets);el.setAttribute('aria-checked',widgets[key]);render();return}
 if(el.dataset.notifyToggle){const key=el.dataset.notifyToggle;notify[key]=!notify[key];save('notify',notify);render();toast('通知動作を保存しました（デモ設定）。');return}
 if(el.dataset.channel){openChannel(el.dataset.channel);return}
 if(el.dataset.runbook!==undefined){openRunbook(Number(el.dataset.runbook));return}
 if(el.dataset.serviceLogs){state.scope=el.dataset.serviceLogs;state.severity='all';state.query='';state.node='all';closeDrawer();nav('logs');return}
 if(el.dataset.serviceAnalytics){state.scope=el.dataset.serviceAnalytics;closeDrawer();nav('analytics');return}
 if(el.dataset.saveIncident){ack[el.dataset.saveIncident]=$('#incidentStatus').value;save('ack',ack);closeDrawer();render();toast('インシデントの対応状態を保存しました。');return}
 if(el.dataset.copyLog){const x=logs.find(x=>x.id===el.dataset.copyLog);try{await navigator.clipboard.writeText(`2026-11-03 ${x.time} JST ${x.id} ${x.service}/${x.node} ${x.check}\n${x.summary}`);toast('ログをコピーしました。')}catch{toast('コピーできませんでした。ログ本文を選択してコピーしてください。')}return}
 if(el.dataset.flow){const f=el.dataset.flow;if(f==='notifications'){nav('notifications')}else{state.severity=f==='all'?'abnormal':f==='error'?'errors':'warn';state.query='';state.node='all';nav('logs')}return}
 if(el.dataset.heat){const [date,h,count]=el.dataset.heat.split('|');$('#heatDetail').textContent=`${date} ${h}:00 – ${Number(h)+2}:00 (JST) / 異常検知 ${count} 件`;return}
 switch(el.dataset.action){
 case 'close-drawer':closeDrawer();break;
 case 'refresh':render();toast('サンプルデータを再表示しました。集計基準：2026/11/03 19:28 JST');break;
 case 'widgets':openWidgets();break;
 case 'reset-widgets':widgets={trend:true,services:true,flow:true,incidents:true,logs:true};save('widgets',widgets);render();openWidgets();toast('初期の表示構成に戻しました。');break;
 case 'export':exportCSV();break;
 case 'clear-filters':state.scope='all';state.severity='all';state.query='';state.node='all';render();break;
 case 'add-rule':openRule();break;
 case 'test-rule':{const val=Number($('#testValue').value),threshold=Number($('#ruleThreshold').value);if($('#testValue').value===''||$('#ruleThreshold').value===''||!Number.isFinite(val)||val<0){$('#testResult').textContent='0以上の数値を入力してください。';break}const op=$('#ruleOperator').value,hit=op==='≥'?val>=threshold:val>threshold;$('#testResult').innerHTML=`<span class="${hit?'text-amber':'text-green'}">${hit?'条件に一致':'正常範囲'}：${nf(val)} ${op} ${nf(threshold)} → ${hit?`${severityNames[$('#ruleSeverity').value]} / ${$('#ruleAction').value}`:'記録のみ'}</span>`;break}
 case 'test-notification':$('#notificationTestResult').textContent='✓ 模擬通知が完了しました。外部への送信は行っていません。';break;
 }
});
document.addEventListener('change',e=>{if(e.target.id==='scopeFilter'){state.scope=e.target.value;render()}if(e.target.id==='envFilter'){state.env=e.target.value;render()}if(e.target.id==='compareCheck'){state.compare=e.target.checked;render()}if(e.target.id==='severityFilter'){state.severity=e.target.value;render()}if(e.target.id==='nodeFilter'){state.node=e.target.value;render()}});
document.addEventListener('input',e=>{if(e.target.id==='logSearch'){state.query=e.target.value;$('#logResults').innerHTML=logTable(filteredLogs());$('#logCount').textContent=`${filteredLogs().length} 件 / 代表ログ 24件`}if(e.target.id==='ruleSearch'){state.ruleQuery=e.target.value;const caret=e.target.selectionStart;render();$('#ruleSearch').focus();$('#ruleSearch').setSelectionRange(caret,caret)}});
document.addEventListener('submit',e=>{if(e.target.id==='ruleForm'){e.preventDefault();const id=e.target.dataset.id;let r=rules.find(x=>x.id===id);const isNew=!r;if(!r)r={id:'r'+Date.now(),enabled:true,count:0,condition:'metric_value > 10'};const threshold=Number($('#ruleThreshold').value);if(!Number.isFinite(threshold)||threshold<0)return;const condition=r.condition.replace(/[≥>]\s*\d+(?:\.\d+)?/,`${$('#ruleOperator').value} ${threshold}`);Object.assign(r,{name:$('#ruleName').value.trim(),code:$('#ruleCode').value.trim(),scope:$('#ruleScope').value,threshold,condition,severity:$('#ruleSeverity').value,interval:$('#ruleInterval').value,action:$('#ruleAction').value});if(!r.name)return;if(isNew)rules.push(r);logRuleChange(isNew?'ルールを追加':'判定条件・通知設定を更新',r);closeDrawer();render();toast('監視ルールを保存しました。本番環境には反映されません。')}if(e.target.id==='channelForm'){e.preventDefault();const key=e.target.dataset.key;save('channel-'+key,$('#channelDest').value.trim());if(key!=='external'){notify[key]=$('#channelEnabled').checked;save('notify',notify)}closeDrawer();render();toast('通知先のデモ設定を保存しました。')}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('#drawer').hidden)closeDrawer();$('#sidebar').classList.remove('open')}if(e.key==='/'&&!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();nav('logs');$('#logSearch').focus()}if((e.key==='Enter'||e.key===' ')&&e.target.matches('tr[data-log],tr[data-incident],g[data-flow]')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}if(e.key==='Tab'&&!$('#drawer').hidden){const list=$$('button:not(:disabled),input,select,textarea,a[href],[tabindex="0"]',$('#drawer'));const first=list[0],last=list[list.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
$('#overlay').addEventListener('click',closeDrawer);
$('#menuBtn').innerHTML=icon('menu');$('#searchIcon').innerHTML=icon('search');$('#notificationBtn').innerHTML=icon('bell');$('#menuBtn').onclick=()=>$('#sidebar').classList.toggle('open');$('#notificationBtn').onclick=()=>nav('incidents');$('#searchTrigger').onclick=()=>{nav('logs');$('#logSearch').focus()};
function setTheme(theme){document.documentElement.dataset.theme=theme;$('#themeBtn').innerHTML=icon(theme==='dark'?'sun':'moon');$('#themeBtn').setAttribute('aria-label',theme==='dark'?'ライトモードに切り替え':'ダークモードに切り替え');save('theme',theme)}
$('#themeBtn').onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
window.addEventListener('hashchange',()=>{if(pageMeta[location.hash.slice(1)])nav(location.hash.slice(1))});
setTheme(getStored('theme','dark'));nav(location.hash.slice(1)||'dashboard');

</script>
</body>
</html>
